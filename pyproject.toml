[project]
name = "salesflow-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.6", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pandas>=2.2", "numpy>=1.26", "faker>=30", "pyarrow>=17", "pydantic>=2.8", "python-dotenv>=1.0", "streamlit>=1.40", "plotly>=5.24", "google-genai>=1.0", "playwright>=1.49", "apscheduler>=3.10", "python-multipart>=0.0.12", "argon2-cffi>=23.1"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["database*"]
exclude = ["frontend*", "infrastructure*", "legacy-crm*"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests", "tests"]

[tool.ruff]
line-length = 100

